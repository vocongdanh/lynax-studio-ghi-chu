<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1 data-text="title"></h1>
        <span class="revision" id="revision"></span>
      </header>
      <form id="add">
        <input id="note-title" maxlength="200" required />
        <button type="submit" data-text="add"></button>
      </form>
      <div class="toolbar">
        <button id="undo" type="button" data-text="undo"></button>
        <button id="redo" type="button" data-text="redo"></button>
        <button id="ask" type="button" data-text="ask"></button>
        <button id="export" type="button" data-text="export"></button>
      </div>
      <p class="error" id="error" role="alert"></p>
      <ul id="notes"></ul>
      <section id="proposals-section" hidden>
        <h2 data-text="proposals"></h2>
        <ul id="proposals"></ul>
      </section>
    </main>
  </body>
</html>
